# The rebuild DAG. Single source of truth for task ids, dependencies and file ownership.
# Validate and print waves:  python3 docs/rebuild/dag.py
# What can start now:        python3 docs/rebuild/dag.py --done P0,B1,W1
#
# owns: paths (files, or directories ending in "/") the task may create, edit or delete.
# Two tasks that can run at the same time (neither depends on the other, directly or not) must not
# own overlapping paths; dag.py checks this. Existing test files and the seed are the only exceptions
# (see README.md, "Shared files").

[vars]
core = "backend/packages/core/src/troubadour/core/"
sound = "backend/packages/sound/src/troubadour/sound/"
lore = "backend/packages/lore/src/troubadour/lore/"
cloud = "backend/packages/cloud/src/troubadour/cloud/"
engine = "backend/packages/engine/src/troubadour/engine/"
server = "backend/packages/server/src/troubadour/server/"
tests = "backend/tests/"
seed = "backend/spike/seed/"
api = "web/packages/api/src/"
ui = "web/packages/ui/src/"
app = "web/app/src/"

# ---------------------------------------------------------------- P: prep
[[task]]
id = "P0"
title = "Design references in docs/, scratch-server script"
size = "S"
deps = []
owns = ["docs/design/", ".gitignore", "scripts/scratch.sh", "shared/test-vectors/"]

# ---------------------------------------------------------------- B: backend restructure
[[task]]
id = "B1"
title = "uv workspace: move modules into six packages, layer contract"
size = "L"
deps = ["P0"]
owns = ["backend/"]

[[task]]
id = "B2"
title = "Split the engine module into focused modules"
size = "L"
deps = ["B1"]
owns = ["{engine}", "{tests}"]

[[task]]
id = "B3"
title = "Split the server into routers + dependency module"
size = "L"
deps = ["B2"]
owns = ["{server}", "{tests}"]

[[task]]
id = "B4"
title = "Demo seed: a scratch data dir with The Sunken Crown"
size = "M"
deps = ["B1"]
owns = ["{seed}", "backend/spike/seed_demo.py"]

[[task]]
id = "B5"
title = "Python type checking with a committed baseline"
size = "S"
deps = ["B3", "W1"]
owns = ["backend/pyproject.toml", "backend/.basedpyright/", "package.json"]

[[task]]
id = "B6"
title = "API types generated from the server's OpenAPI schema"
size = "M"
deps = ["B5", "A1"]
owns = ["{server}openapi.py", "{server}routers/players.py", "web/packages/api/scripts/", "{api}campaigns/types.ts", "{tests}test_openapi.py"]

