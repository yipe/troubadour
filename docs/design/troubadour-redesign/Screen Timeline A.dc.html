<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/dprcalc-ui-90f43347-2537-47fd-a899-77c197701e7b/_ds_bundle.css">
  <script src="_ds/dprcalc-ui-90f43347-2537-47fd-a899-77c197701e7b/_ds_bundle.js"></script>
  <style>body{margin:0;background:#14151e}a{color:var(--color-accent-fg)}a:hover{color:var(--color-fg-default)}</style>
</helmet>
<div data-screen-label="Campaign timeline A (swimlanes)" style="width:1440px;height:900px;overflow:hidden;display:flex;flex-direction:column;background:var(--color-bg-canvas);color:var(--color-fg-default);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45">
<x-import component-from-global-scope="YipeUi.DprcalcProvider" theme="dark" hint-size="1440px,900px">
  <dc-import name="Troubadour Nav" active="timeline" hint-size="1440px,56px"></dc-import>
  <main style="flex:1;padding:24px 40px;display:flex;flex-direction:column;gap:14px;min-height:0;box-sizing:border-box">
    <div style="display:flex;align-items:flex-end;gap:16px">
      <div style="flex:1">
        <x-import component-from-global-scope="YipeUi.PageHeading" hint-size="300px,40px">The story so far</x-import>
        <div style="color:var(--color-fg-subtle);font-size:13px">12 sessions · Sep 3 – Oct 22 · 38 h 40 m at the table</div>
      </div>
      <div style="display:flex;gap:16px;font-size:12px;color:var(--color-fg-subtle);flex-wrap:wrap">
        <sc-for list="{{ legend }}" as="p" hint-placeholder-count="5"><span style="display:flex;gap:6px;align-items:center"><span style="width:9px;height:9px;border-radius:2px;background:{{ p.c }}"></span>{{ p.n }}</span></sc-for>
      </div>
    </div>
    <div style="flex:1;min-height:0;border:1px solid var(--color-border-default);border-radius:8px;background:var(--color-bg-surface);display:grid;grid-template-columns:150px repeat(12,minmax(0,1fr));grid-template-rows:auto 120px 230px auto auto auto;overflow:hidden">
      <div style="padding:10px 14px;border-bottom:1px solid var(--color-border-default);background:var(--color-bg-subtle)"></div>
      <sc-for list="{{ cols }}" as="s" hint-placeholder-count="12">
        <div style="padding:10px 6px;border-bottom:1px solid var(--color-border-default);border-left:1px solid var(--color-border-subtle);background:{{ s.hbg }};text-align:center;line-height:1.2"><div style="font-weight:700;font-family:Georgia,'Iowan Old Style',serif">S{{ s.n }}</div><div style="font-size:11px;color:var(--color-fg-subtle)">{{ s.date }}</div></div>
      </sc-for>

      <div style="padding:12px 14px;border-bottom:1px solid var(--color-border-default);display:flex;flex-direction:column;gap:2px"><span style="font-weight:700">Where</span><span style="font-size:12px;color:var(--color-fg-subtle)">the party’s path</span></div>
      <div style="grid-column:2 / -1;position:relative;border-bottom:1px solid var(--color-border-default)">
        <div style="position:absolute;left:0;right:0;top:0;bottom:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr))">
          <sc-for list="{{ cols }}" as="s" hint-placeholder-count="12">
            <div style="position:relative;border-left:1px solid var(--color-border-subtle)">
              <span style="position:absolute;left:-1px;right:0;top:{{ s.y }};height:3px;background:{{ s.lineC }};transform:translateY(-1px)"></span>
              <sc-if value="{{ s.showV }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:-2px;width:3px;top:{{ s.vTop }};height:{{ s.vH }};background:var(--color-border-strong)"></span></sc-if>
              <span style="position:absolute;left:50%;top:{{ s.y }};width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);background:{{ s.dot }};box-shadow:0 0 0 3px var(--color-bg-surface)"></span>
              <sc-if value="{{ s.label }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:6px;top:calc({{ s.y }} + 12px);font-size:12px;font-weight:600;white-space:nowrap;color:{{ s.lc }}">{{ s.place }}</span></sc-if>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="padding:12px 14px;border-bottom:1px solid var(--color-border-default);display:flex;flex-direction:column;gap:2px"><span style="font-weight:700">Who talked</span><span style="font-size:12px;color:var(--color-fg-subtle)">share of each session</span></div>
      <sc-for list="{{ cols }}" as="s" hint-placeholder-count="12">
        <div style="padding:10px 10px 8px;border-bottom:1px solid var(--color-border-default);border-left:1px solid var(--color-border-subtle);display:flex;flex-direction:column;gap:6px;background:{{ s.cbg }}">
          <div style="flex:1;display:flex;flex-direction:column-reverse;gap:2px;border-radius:4px;overflow:hidden">
            <sc-for list="{{ s.talk }}" as="t" hint-placeholder-count="5"><span style="height:{{ t.h }};background:{{ t.c }}"></span></sc-for>
          </div>
          <div style="font-size:11px;color:var(--color-fg-subtle);text-align:center">{{ s.top }}</div>
        </div>
      </sc-for>

      <div style="padding:12px 14px;border-bottom:1px solid var(--color-border-default)"><span style="font-weight:700">New faces</span></div>
      <sc-for list="{{ cols }}" as="s" hint-placeholder-count="12">
        <div style="padding:10px 6px;border-bottom:1px solid var(--color-border-default);border-left:1px solid var(--color-border-subtle);display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:flex-start">
          <sc-for list="{{ s.faces }}" as="f" hint-placeholder-count="2"><span style="font-size:11px;padding:1px 6px;border-radius:4px;background:var(--color-subtle-badge-bg);color:{{ f.c }};white-space:nowrap">{{ f.n }}</span></sc-for>
        </div>
      </sc-for>

      <div style="padding:12px 14px;border-bottom:1px solid var(--color-border-default)"><span style="font-weight:700">Facts learned</span></div>
      <sc-for list="{{ cols }}" as="s" hint-placeholder-count="12">
        <div style="padding:10px 8px;border-bottom:1px solid var(--color-border-default);border-left:1px solid var(--color-border-subtle);display:flex;gap:6px;align-items:center;justify-content:center">
          <span style="height:6px;border-radius:3px;width:{{ s.fw }};background:var(--color-accent-emphasis)"></span><span style="font-size:12px;color:var(--color-fg-muted);font-variant-numeric:tabular-nums">{{ s.facts }}</span>
        </div>
      </sc-for>

      <div style="padding:12px 14px"><span style="font-weight:700">Headline</span></div>
      <sc-for list="{{ cols }}" as="s" hint-placeholder-count="12">
        <div style="padding:10px 8px;border-left:1px solid var(--color-border-subtle);font-size:12px;color:var(--color-fg-muted);text-wrap:pretty;line-height:1.35">{{ s.title }}</div>
      </sc-for>
    </div>
  </main>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    const C = { gm: "var(--color-class-paladin)", pip: "var(--color-class-bard)", ve: "var(--color-class-wizard)", br: "var(--color-class-barbarian)", th: "var(--color-class-druid)" };
    const legend = [["Alex (GM)", C.gm], ["Pip", C.pip], ["Velis", C.ve], ["Brann", C.br], ["Thessaly", C.th]].map(([n, c]) => ({ n, c }));
    const places = { "Saltreach": 22, "Marrow Street": 48, "Merrow’s chapel": 74, "Saltreach docks": 34, "Gull’s Debt": 62, "Drowned Abbey": 86 };
    const S = [
      [1, "Sep 3", "Saltreach", "The party meets at the Lantern", [46, 16, 14, 12, 12], ["Saltreach"], 9],
      [2, "Sep 10", "Saltreach", "A job from the temple", [50, 14, 12, 14, 10], ["Sister Merrow"], 12],
      [3, "Sep 17", "Saltreach", "The Eclipse Heist", [44, 20, 12, 14, 10], ["Diamond of Ysolde"], 21],
      [4, "Sep 24", "Marrow Street", "Chasing the thief", [48, 18, 10, 16, 8], ["Marrow Street"], 14],
      [5, "Oct 1", "Merrow’s chapel", "Sister Merrow’s confession", [52, 12, 16, 8, 12], ["The Tidecallers"], 18],
      [6, "Oct 3", "Saltreach docks", "Oaths at Low Water", [40, 14, 12, 24, 10], [], 11],
      [7, "Oct 5", "Saltreach docks", "A short one", [58, 12, 10, 10, 10], [], 4],
      [8, "Oct 8", "Saltreach docks", "The Tidecaller Offer", [47, 15, 17, 9, 12], ["Captain Orsa Vell"], 16],
      [9, "Oct 10", "Saltreach docks", "Smoke on the Docks", [45, 19, 13, 13, 10], ["Gull’s Debt"], 13],
      [10, "Oct 12", "Gull’s Debt", "Debts and Riddles", [49, 21, 12, 8, 10], ["The Abbot"], 15],
      [11, "Oct 15", "Gull’s Debt", "Bells of Saltreach", [44, 17, 18, 11, 10], [], 17],
      [12, "Oct 22", "Drowned Abbey", "The Drowned Abbey", [46, 17, 15, 12, 10], ["Drowned Abbey"], 9]
    ];
    const keys = ["gm", "pip", "ve", "br", "th"], names = ["Alex", "Pip", "Velis", "Brann", "Thessaly"];
    const cols = S.map(([n, date, place, title, talk, faces, facts], i) => {
      const prev = S[i - 1];
      const label = !prev || prev[2] !== place;
      const last = i === S.length - 1;
      const topI = talk.slice(1).indexOf(Math.max(...talk.slice(1))) + 1;
      return {
        n, date, place, title, label, y: places[place] + "%",
        lineC: "var(--color-border-strong)", dot: last ? "var(--color-accent-emphasis)" : label ? "var(--color-accent-fg)" : "var(--color-border-strong)",
        lc: last ? "var(--color-accent-fg)" : "var(--color-fg-muted)",
        hbg: last ? "var(--color-accent-subtle)" : "transparent", cbg: last ? "color-mix(in oklch, var(--color-accent-subtle) 50%, transparent)" : "transparent",
        talk: talk.map((p, j) => ({ h: p + "%", c: C[keys[j]] })),
        top: names[topI] + " " + talk[topI] + "%",
        faces: faces.map(f => ({ n: f, c: f.includes("Diamond") ? "var(--color-rarity-legendary)" : "var(--color-subtle-badge-fg)" })),
        facts, fw: (facts * 3) + "px",
        showV: !!prev && prev[2] !== place, vTop: prev ? Math.min(places[prev[2]], places[place]) + "%" : "0%", vH: prev ? Math.abs(places[prev[2]] - places[place]) + "%" : "0%"
      };
    });
    return { legend, cols };
  }
}
</script>
</body>
</html>
