<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/dprcalc-ui-90f43347-2537-47fd-a899-77c197701e7b/_ds_bundle.css">
  <script src="_ds/dprcalc-ui-90f43347-2537-47fd-a899-77c197701e7b/_ds_bundle.js"></script>
  <script src="data.js"></script>
  <style>body{margin:0;background:#14151e}a{color:var(--color-accent-fg)}a:hover{color:var(--color-fg-default)}</style>
</helmet>
<div data-screen-label="Facts C (by entry)" style="width:1440px;height:900px;overflow:hidden;display:flex;flex-direction:column;background:var(--color-bg-canvas);color:var(--color-fg-default);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45">
<x-import component-from-global-scope="YipeUi.DprcalcProvider" theme="dark" hint-size="1440px,900px">
  <dc-import name="Troubadour Nav" active="facts" hint-size="1440px,56px"></dc-import>
  <div style="flex:1;display:flex;min-height:0">
    <aside style="width:380px;flex:none;border-right:1px solid var(--color-border-default);display:flex;flex-direction:column;min-height:0">
      <div style="padding:16px;display:flex;gap:8px;border-bottom:1px solid var(--color-border-default)">
        <div style="flex:1;display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:1px solid var(--color-border-default);border-radius:6px;background:var(--color-bg-surface);color:var(--color-fg-subtle);font-size:13px;white-space:nowrap"><dc-import name="Icon" n="search" s="14" hint-size="14px,14px"></dc-import>Search facts, names, quotes…</div>
        <button style="height:36px;padding:0 12px;border-radius:6px;border:none;background:var(--color-accent-emphasis);color:var(--color-fg-on-accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center"><dc-import name="Icon" n="plus" s="14" hint-size="14px,14px"></dc-import>Add fact</button>
      </div>
      <div style="flex:1;overflow:hidden;padding:8px">
        <sc-for list="{{ rail }}" as="g" hint-placeholder-count="3">
          <div style="font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-fg-subtle);padding:12px 12px 6px">{{ g.title }}</div>
          <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="5">
            <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;background:{{ it.bg }};box-shadow:{{ it.ring }}">
              <span style="width:{{ it.dw }};height:{{ it.dw }};border-radius:50%;flex:none;background:{{ it.c }}"></span>
              <span style="flex:1;font-weight:{{ it.w }}">{{ it.t }}</span>
              <span style="font-size:12px;color:var(--color-fg-subtle);font-variant-numeric:tabular-nums">{{ it.n }}</span>
            </div>
          </sc-for>
        </sc-for>
      </div>
    </aside>
    <main style="flex:1;min-width:0;padding:24px 40px;display:flex;flex-direction:column;gap:16px;min-height:0;box-sizing:border-box">
    <div style="display:flex;align-items:flex-end;gap:16px">
      <div style="flex:1">
        <x-import component-from-global-scope="YipeUi.PageHeading" hint-size="300px,40px">Facts by entry</x-import>
        <div style="color:var(--color-fg-subtle);font-size:13px">Grouped by who or what they’re about. Busiest entries first.</div>
      </div>
      <div style="display:flex;gap:16px;font-size:12px;color:var(--color-fg-subtle);align-items:center">
        <span style="display:flex;gap:6px;align-items:center"><span style="width:8px;height:8px;border-radius:50%;background:var(--color-success-fg)"></span>GM stated</span>
        <span style="display:flex;gap:6px;align-items:center"><span style="width:8px;height:8px;border-radius:50%;background:var(--color-warning-fg)"></span>Party theory</span>
        <span style="display:flex;gap:6px;align-items:center"><span style="width:8px;height:8px;border-radius:50%;background:var(--color-fg-subtle)"></span>Heard once</span>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;flex:1;min-height:0;align-content:start">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="6">
        <div style="background:var(--color-bg-surface);border:1px solid var(--color-border-default);border-radius:8px;display:flex;flex-direction:column">
          <div style="display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--color-border-default)">
            <span style="font-family:Georgia,'Iowan Old Style',serif;font-size:17px;font-weight:700;color:{{ g.c }}">{{ g.n }}</span>
            <span style="font-size:11px;padding:1px 6px;border-radius:4px;background:var(--color-subtle-badge-bg);color:var(--color-subtle-badge-fg)">{{ g.type }}</span>
            <span style="margin-left:auto;font-size:12px;color:var(--color-fg-subtle)">{{ g.count }}</span>
          </div>
          <sc-for list="{{ g.facts }}" as="f" hint-placeholder-count="3">
            <div style="display:flex;gap:10px;padding:9px 16px;border-bottom:1px solid var(--color-border-subtle)">
              <span style="width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px;background:{{ f.dot }}"></span>
              <div style="flex:1;min-width:0">
                <div style="font-size:14px;text-wrap:pretty">{{ f.t }}</div>
                <div style="font-size:12px;color:var(--color-fg-subtle)"><span style="color:{{ f.c }};font-weight:600">{{ f.who }}</span> · S{{ f.s }} <a href="#" style="text-decoration:none;font-family:ui-monospace,Menlo,monospace">{{ f.at }}</a></div>
              </div>
            </div>
          </sc-for>
          <div style="padding:8px 16px;font-size:12px;color:var(--color-accent-fg)">{{ g.more }}</div>
        </div>
      </sc-for>
    </div>
  </main>
  </div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  componentDidMount() { if (!window.TB) { const i = setInterval(() => { if (window.TB) { clearInterval(i); this.forceUpdate(); } }, 50); } }
  renderVals() {
    const TB = window.TB;
    if (!TB) return { groups: [] };
    const dot = { gm: "var(--color-success-fg)", theory: "var(--color-warning-fg)", once: "var(--color-fg-subtle)" };
    const order = [["Diamond of Ysolde", "Item", 6], ["Captain Orsa Vell", "NPC", 9], ["Drowned Abbey", "Place", 4], ["The Tidecallers", "Faction", 7], ["The Abbot", "NPC", 2], ["Brann Coldwater", "PC", 11]];
    const groups = order.map(([n, type, total]) => {
      const fs = TB.facts.filter(f => f.about === n).slice(0, 3).map(f => Object.assign({}, f, { dot: dot[f.ck] }));
      return { n, type, count: total + " facts", c: type === "Item" ? "var(--color-rarity-legendary)" : type === "PC" ? "var(--color-class-barbarian)" : "var(--color-fg-default)", facts: fs, more: total > fs.length ? `Open entry · ${total - fs.length} more` : "Open entry" };
    });
    const it = (t, n, c, on) => ({ t, n, c: c || "transparent", dw: c ? "10px" : "0px", bg: on ? "var(--color-bg-surface)" : "transparent", ring: on ? "inset 0 0 0 1px var(--color-accent-emphasis)" : "none", w: on ? 600 : 500 });
    const rail = [
      { title: "About", items: [it("Everything", "389", 0, 1), it("NPCs", "142"), it("Places", "88"), it("Items", "51"), it("Factions", "39"), it("PCs", "69")] },
      { title: "How sure", items: [it("GM stated", "214", "var(--color-success-fg)"), it("Party theory", "98", "var(--color-warning-fg)"), it("Heard once", "77", "var(--color-fg-subtle)")] },
      { title: "Said by", items: [it("Alex · GM and NPCs", "231", "var(--color-class-paladin)"), it("Pip · Sam", "52", "var(--color-class-bard)"), it("Velis · Maya", "44", "var(--color-class-wizard)"), it("Thessaly · Jo", "33", "var(--color-class-druid)"), it("Brann · Rin", "29", "var(--color-class-barbarian)")] }
    ];
    return { groups, rail };
  }
}
</script>
</body>
</html>
