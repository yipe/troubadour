<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/dprcalc-ui-90f43347-2537-47fd-a899-77c197701e7b/_ds_bundle.css">
  <script src="_ds/dprcalc-ui-90f43347-2537-47fd-a899-77c197701e7b/_ds_bundle.js"></script>
</helmet>
<x-import component-from-global-scope="YipeUi.DprcalcProvider" theme="dark" hint-size="100%,56px">
<header style="height:56px;display:flex;align-items:center;gap:20px;padding:0 20px;background:var(--color-bg-canvas);border-bottom:1px solid var(--color-border-default);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:var(--color-fg-default);white-space:nowrap;box-sizing:border-box;flex:none">
  <div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;font-family:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,serif">
    <dc-import name="Icon" n="feather" s="20" c="var(--color-accent-fg)" hint-size="20px,20px"></dc-import>
    Troubadour
  </div>
  <button style="display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;background:var(--color-bg-surface);border:1px solid var(--color-border-default);color:var(--color-fg-default);font:inherit;font-size:13px;font-weight:600;cursor:pointer">
    <span style="width:8px;height:8px;border-radius:2px;background:var(--color-class-warlock)"></span>
    The Sunken Crown
    <dc-import name="Icon" n="chevrons-up-down" s="14" c="var(--color-fg-subtle)" hint-size="14px,14px"></dc-import>
  </button>
  <nav style="display:flex;align-items:stretch;gap:18px;height:100%">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
      <div style="display:flex;align-items:center;gap:6px;position:relative">
        <x-import component-from-global-scope="YipeUi.UnderlinedTab" is-active="{{ t.on }}" hint-size="70px,40px">{{ t.label }}</x-import>
        <sc-if value="{{ t.dot }}" hint-placeholder-val="{{ false }}"><span style="width:7px;height:7px;border-radius:50%;background:var(--color-danger-fg)"></span></sc-if>
      </div>
    </sc-for>
  </nav>
  <div style="flex:1"></div>
  <sc-if value="{{ live }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;background:var(--color-danger-bg);color:var(--color-danger-fg);font-size:12px;font-weight:700;letter-spacing:0.06em">
      <span style="width:8px;height:8px;border-radius:50%;background:var(--color-danger-fg);box-shadow:0 0 0 3px var(--color-danger-bg)"></span>
      RECORDING
      <span style="font-variant-numeric:tabular-nums;font-weight:600;color:var(--color-fg-default);letter-spacing:0">1:42:08</span>
    </div>
  </sc-if>
  <sc-if value="{{ showCloud }}" hint-placeholder-val="{{ false }}">
    <button style="display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:6px;background:{{ cloudBg }};border:1px solid {{ cloudBd }};color:{{ cloudFg }};font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap"><dc-import name="Icon" n="{{ cloudIcon }}" s="14" hint-size="14px,14px"></dc-import>{{ cloudText }}</button>
  </sc-if>
  <button style="display:flex;align-items:center;gap:12px;height:30px;padding:0 10px;border-radius:6px;background:transparent;border:1px solid var(--color-border-default);color:var(--color-fg-muted);font:inherit;font-size:12px;cursor:pointer">
    <span style="display:flex;align-items:center;gap:6px"><dc-import name="Icon" n="lock" s="12" hint-size="12px,12px"></dc-import>On this Mac</span>
    <span style="display:flex;align-items:center;gap:6px"><span style="width:7px;height:7px;border-radius:50%;background:var(--color-success-fg)"></span>AI ready</span>
  </button>
  <div style="width:30px;height:30px;border-radius:50%;background:var(--color-bg-elevated);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--color-fg-muted)">AK</div>
</header>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:56},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;sessions&quot;,&quot;codex&quot;,&quot;facts&quot;,&quot;ask&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;live&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? "home";
    const live = !!this.props.live;
    const tabs = [["home","Home"],["sessions","Sessions"],["timeline","Timeline"],["codex","Codex"],["facts","Facts"],["ask","Ask"]].map(([id,label]) => ({ label, on: id === active, dot: live && id === "sessions" }));
    const cloud = this.props.cloud ?? "off";
    const open = cloud === "open";
    return { tabs, live, showCloud: cloud !== "off", cloudText: cloud === "connect" ? "Cloud backup" : "Backed up 4 min ago", cloudIcon: cloud === "connect" ? "cloud-off" : "cloud", cloudBg: open ? "var(--color-accent-subtle)" : "transparent", cloudBd: open ? "var(--color-accent-emphasis)" : "var(--color-border-default)", cloudFg: open ? "var(--color-accent-fg)" : "var(--color-fg-muted)" };
  }
}
</script>
</body>
</html>
