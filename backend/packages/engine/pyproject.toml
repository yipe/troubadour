[project]
name = "troubadour-engine"
version = "0.1.0"
description = "Troubadour engine: live session engine, improve, cloning, sim"
requires-python = ">=3.12"
dependencies = [
    "troubadour-core",
    "troubadour-sound",
    "troubadour-lore",
]

[project.scripts]
troubadour-sim = "troubadour.engine.sim:main"

[tool.uv.sources]
troubadour-core = { workspace = true }
troubadour-sound = { workspace = true }
troubadour-lore = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "troubadour.engine"
