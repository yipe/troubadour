[project]
name = "troubadour-cloud"
version = "0.1.0"
description = "Troubadour cloud: vault backup"
requires-python = ">=3.12"
dependencies = [
    "troubadour-core",
    "httpx>=0.28.1",
]

[tool.uv.sources]
troubadour-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "troubadour.cloud"
