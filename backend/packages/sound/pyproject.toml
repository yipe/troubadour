[project]
name = "troubadour-sound"
version = "0.1.0"
description = "Troubadour sound: audio, ASR, voices, TTS"
requires-python = ">=3.12"
dependencies = [
    "troubadour-core",
    # Whisper and the voice clones on Apple Silicon; faster-whisper everywhere else (docs/adr/0011).
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-audio>=0.6.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.2; sys_platform != 'darwin'",
    "tiktoken>=0.9",  # counts Whisper prompt tokens (asr.py) on every machine
    "pyannote-audio>=4.0.7",
    "silero-vad>=6.2.3",
    "sounddevice>=0.5.6",
    "soxr>=1.1.0",
    "scipy>=1.18.1",
    "numpy",
]

[tool.uv.sources]
troubadour-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "troubadour.sound"
