[project]
name = "troubadour-core"
version = "0.1.0"
description = "Troubadour core: config, settings, LLM providers, transcript helpers"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.10",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "troubadour.core"
