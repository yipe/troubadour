[project]
name = "troubadour-workspace"
version = "0.1.0"
description = "Live, speaker-labeled transcription of an in-person D&D table, all local (uv workspace root)"
requires-python = ">=3.12"
dependencies = [
    "troubadour-core",
    "troubadour-sound",
    "troubadour-lore",
    "troubadour-cloud",
    "troubadour-engine",
    "troubadour-server",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
troubadour-core = { workspace = true }
troubadour-sound = { workspace = true }
troubadour-lore = { workspace = true }
troubadour-cloud = { workspace = true }
troubadour-engine = { workspace = true }
troubadour-server = { workspace = true }

[dependency-groups]
dev = [
    "basedpyright",
    "import-linter",
    "pytest>=8.4",
    "ruff>=0.14",
]
# Benchmark scripts in spike/ only: `uv run --group spike spike/eval.py ...`
spike = [
    "jiwer>=4.0.0",
    "librosa>=1.0.0",
    "pyannote-metrics>=4.1",
    "whisper-normalizer>=0.1.15",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT"]
ignore = [
    "E501",  # the formatter owns line length
    "SIM108",  # ternaries aren't always clearer
]

[tool.ruff.lint.per-file-ignores]
# Research scripts: kept as they were when the benchmark numbers were produced.
"spike/*" = ["B905", "B023", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # Third-party noise, not ours:
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore::DeprecationWarning:torchaudio",
    "ignore::UserWarning:torchaudio",
    "ignore::FutureWarning",
]

[tool.importlinter]
root_packages = ["troubadour.core", "troubadour.sound", "troubadour.lore", "troubadour.cloud", "troubadour.engine", "troubadour.server"]

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = ["troubadour.server", "troubadour.engine", "troubadour.cloud", "troubadour.lore | troubadour.sound", "troubadour.core"]
